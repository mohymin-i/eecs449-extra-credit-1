[project]
name = "campus-planner"
default-app = "web"
jac-version = "==0.37.23"

[apps.server]
kind = "service"
entry-point = "server.planner"

[apps.web]
kind = "web-app"
entry-point = "web.main"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"
platform = "web"

[apps.cli]
kind = "cli"
entry-point = "cli.main"

[test]
directories = ["server", "web", "mobile", "cli"]

[dependencies.npm]
react-native-web = "^0.21.2"

[byllm.model]
default_model = "anthropic/claude-sonnet-5"

[client.app_meta_data]
title = "Campus Planner"
description = "A personal planning tool for coursework, schedules, and habits."
